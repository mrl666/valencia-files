name: Send Valencia Files

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Fetch weather
        run: node weather.js > weather.json

      - name: Fetch Valencia news
        run: node valencia.js > valencia.json

      - name: Fetch Alicante news
        run: node alicante.js > alicante.json || echo '[]' > alicante.json

      - name: Fetch Castellón news
        run: node castellon.js > castellon.json || echo '[]' > castellon.json

      - name: Update index.html
        run: node update.js

      - name: Commit updated page
        run: |
          git config user.name "valencia-files-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html used.json used-news.json
          git commit -m "Edition update $(date -u +'%Y-%m-%dT%H:%M')" || echo "No changes"
          git push

      - name: Send email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: node send.js
