name: Send Valencia Files

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Fetch weather
        run: node weather.js > weather.json || echo '[]' > weather.json

      - name: Fetch GVA lead
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: node fetch-lead.js > lead.json || echo '{}' > lead.json

      - name: Fetch Valencia news
        run: node valencia.js > valencia.json || echo '[]' > valencia.json

      - name: Show valencia.json
        run: cat valencia.json

      - name: Fetch Alicante news
        run: node alicante.js > alicante.json || echo '[]' > alicante.json

      - name: Show alicante.json
        run: cat alicante.json

      - name: Test dipcas.es
        run: |
          echo "=== HTTP headers ==="
          curl -sI -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" \
            -H "Accept-Language: es-ES,es;q=0.9" \
            https://www.dipcas.es/es/actualidad/ | head -20
          echo ""
          echo "=== First 2000 chars of body ==="
          curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" \
            -H "Accept-Language: es-ES,es;q=0.9" \
            https://www.dipcas.es/es/actualidad/ | head -c 2000
          echo ""
          echo "=== Search for RSS link ==="
          curl -s -A "Mozilla/5.0" https://www.dipcas.es/es/actualidad/ | grep -o -i 'rss[^"]*' | head -5
          echo ""
          echo "=== Search for headline patterns ==="
          curl -s -A "Mozilla/5.0" https://www.dipcas.es/es/actualidad/ | grep -o -i '<h[123][^>]*>.\{0,80\}' | head -10

      - name: Fetch Castellón news
        run: node castellon.js > castellon.json || echo '[]' > castellon.json

      - name: Show castellon.json
        run: cat castellon.json

      - name: Translate headlines
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: node translate.js > translated.json

      - name: Update index.html
        run: node update.js

      - name: Commit updated page
        run: |
          git config user.name "valencia-files-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html used.json used-news.json lead.json translated.json translations-cache.json
          git commit -m "Edition update $(date -u +'%Y-%m-%dT%H:%M')" || echo "No changes"
          git push

      - name: Update index.html
        run: node update.js

      - name: Commit updated page
        run: |
          git config user.name "valencia-files-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html used.json used-news.json lead.json
          git commit -m "Edition update $(date -u +'%Y-%m-%dT%H:%M')" || echo "No changes"
          git push

      - name: Send email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: node send.js
