name: Send Valencia Files

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Fetch weather
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: node weather.js > weather.json

      - name: Update index.html
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: node update.js
      - name: Update index.html
        run: node update.js
      - name: Commit updated page
        run: |
          git config user.name "valencia-files-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html
          git commit -m "Edition update $(date -u +'%Y-%m-%dT%H:%M')" || echo "No changes"
          git push
      - name: Send email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: node send.js
