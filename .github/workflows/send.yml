name: Send Valencia Files

on:
  schedule:
  - cron: '7 6,14,22 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Fetch weather
        run: node weather.js > weather.json || echo '[]' > weather.json

      - name: Fetch Valencia news
        run: node valencia.js > valencia.json || echo '[]' > valencia.json

      - name: Fetch GVA lead
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: node fetch-lead.js > lead.json || echo '{}' > lead.json

      - name: Fetch Alicante news
        run: node alicante.js > alicante.json || echo '[]' > alicante.json

      - name: Fetch Castellón news
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: node castellon.js > castellon.json || echo '[]' > castellon.json

      - name: Fetch Region news
        run: node region.js > region.json || echo '[]' > region.json

      - name: Fetch International view
        run: node international.js > international.json || echo '[]' > international.json

      - name: Fetch Sport
        run: node sport.js > sport.json || echo '[]' > sport.json

      - name: Fetch Admin deadlines
        run: node admin.js > admin.json || echo '[]' > admin.json

      - name: Translate headlines
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: node translate.js > translated.json

      - name: Update index.html
        run: node update.js

      - name: Install PDF dependency
        run: npm install

      - name: Generate PDF
        run: node pdf.js

      - name: Generate archive
        run: node archive.js

      - name: Commit updated page
        run: |
          git config user.name "valencia-files-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html archive.html editions/
          git add used.json used-news.json lead.json translated.json translations-cache.json international.json region.json castellon.json sport.json admin.json
          git commit -m "Edition update $(date -u +'%Y-%m-%dT%H:%M')" || echo "No changes"
          git push

      - name: Send email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: node send.js
